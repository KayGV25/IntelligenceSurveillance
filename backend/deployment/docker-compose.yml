name: ahs-backend-dev

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: ahs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ahs-network

  redis:
    image: redis:7-alpine
    container_name: ahs-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ahs-network

  redpanda:
    image: redpandadata/redpanda:v26.1.9
    container_name: ahs-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - ahs-network

  redpanda-console:
    image: redpandadata/console:v2.8.15
    container_name: ahs-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      SERVER_LISTENPORT: 8088
    ports:
      - "${REDPANDA_CONSOLE_PORT}:8088"
    networks:
      - ahs-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ahs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ahs-network

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: ahs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_RECORDINGS_BUCKET};
      mc mb --ignore-existing local/${MINIO_SNAPSHOTS_BUCKET};
      mc mb --ignore-existing local/${MINIO_FLOORPLANS_BUCKET};
      mc mb --ignore-existing local/${MINIO_EVIDENCE_BUCKET};
      exit 0;
      "
    networks:
      - ahs-network

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: ahs-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ahs-network

  api-gateway:
    build:
      context: ../java-services
      dockerfile: api-gateway/Dockerfile
    container_name: ahs-api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      JWT_ENABLED: true
      JWT_ISSUER: ahs-auth-service
      JWT_JWK_SET_URI: http://auth-service:8081/.well-known/jwks.json

      REDIS_HOST: redis
      REDIS_PORT: 6379

      AUTH_SERVICE_URL: http://auth-service:8081
      CAMERA_SERVICE_URL: http://camera-service:8101
      MAP_SERVICE_URL: http://map-service:8105
      ALERT_SERVICE_URL: http://alert-service:8106
      INCIDENT_SERVICE_URL: http://incident-service:8107
      TRACKING_SERVICE_URL: http://tracking-service:8108
      PLAYBACK_SERVICE_URL: http://playback-service:8104
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - ahs-network

  auth-service:
    build:
      context: ../java-services
      dockerfile: auth-service/Dockerfile
    container_name: ahs-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      AUTH_ISSUER: ahs-auth-service
      JWT_PRIVATE_KEY_PATH: classpath:keys/private.pem
      JWT_PUBLIC_KEY_PATH: classpath:keys/public.pem

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      ACCESS_TOKEN_MINUTES: 60
      REFRESH_TOKEN_DAYS: 30
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ahs-network

  camera-service:
    build:
      context: ../go-services/camera-service
      dockerfile: Dockerfile
    container_name: ahs-camera-service
    ports:
      - "8101:8101"
    environment:
      APP_PORT: 8101

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable

      REDPANDA_BROKERS: redpanda:9092

      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SNAPSHOTS_BUCKET: ${MINIO_SNAPSHOTS_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - ahs-network

  map-service:
    build:
      context: ../go-services/map-service
      dockerfile: Dockerfile
    container_name: ahs-map-service
    restart: unless-stopped
    ports:
      - "8105:8105"
    environment:
      APP_PORT: 8105

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ahs-network

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:
  qdrant_data:

networks:
  ahs-network:
    driver: bridge
